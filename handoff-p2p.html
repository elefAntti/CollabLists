<title>Handoff</title>
<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}

.head{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 6px}.head h2{margin:0}
.hero h1{font-size:1.65rem;line-height:1.2;margin:2px 0 8px;letter-spacing:-.02em}
.center{text-align:center}.center .row{justify-content:center}

.btn{appearance:none;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}

.vh{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:0}
</style>

<body>
<header class="top"><div class="brand"><span class="logo" id="logo"></span>Handoff</div><span class="pill" id="pill" hidden></span></header>
<main id="app"></main>
<input type="file" id="pick" class="vh" multiple tabindex="-1" aria-hidden="true">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
/* ---------- settings: self-host signaling + add a TURN server here for reliability ---------- */
const CONFIG = {
  peer: {
    // host: 'peer.example.com', port: 443, path: '/', secure: true,   // your own PeerJS server
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      // { urls: 'turn:turn.example.com:3478', username: 'user', credential: 'pass' },
    ] },
  },
  joinMinutes: 10,    // how long an invite link is valid
  maxGuests: 5,       // devices per invite
  resumeMinutes: 30,  // how long an approved device may reconnect without a new approval
  chunk: 15000,       // plaintext bytes per message (stays under the 16 KB cross-browser limit)
  memLimit: 1e9,      // max file size when it has to be held in memory (no save folder)
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(t, a = {}, ...c) {
  const e = document.createElement(t);
  for (const k in a) if (a[k] != null && a[k] !== false) k.startsWith('on') ? e[k] = a[k] : e.setAttribute(k, a[k]);
  e.append(...c.flat().filter(x => x != null && x !== false && x !== '')); return e;
}
const enc = new TextEncoder(), dec = new TextDecoder(), sleep = ms => new Promise(r => setTimeout(r, ms));
const sz = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
const b64u = b => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const cat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
const safeName = n => (String(n).split(/[\\/]/).pop().replace(/[\x00-\x1f<>:"|?*]/g, '_').trim().slice(0, 150)) || 'file';
const devName = () => { const u = navigator.userAgent; return (/iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows PC' : /Mac/.test(u) ? 'Mac' : 'Device'); };
const isPhone = n => /iPhone|iPad|Android/.test(n);
const ext = n => (/\.([a-z0-9]{1,5})$/i.exec(n) || [])[1] || 'file';
const hhmm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const touch = matchMedia('(pointer: coarse)').matches;
const INVITE = /#j=(h[0-9a-f]{32})\.([A-Za-z0-9_-]{22})$/, STORE = 'handoff.resume';
function store(v) { try { v ? sessionStorage.setItem(STORE, JSON.stringify(v)) : sessionStorage.removeItem(STORE); } catch (e) {} }

const SVG = {
  logo: '<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  up: '<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  pc: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
};
function ic(n) { const s = h('span', { class: 'ic' }); s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SVG[n] + '</svg>'; return s; }

/* ---------- crypto: HKDF from the link secret, HMAC proofs, AES-GCM with counter nonces ---------- */
async function derive(secret, salt, info, kind) {
  const k = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  const mac = kind == 'mac';
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: enc.encode(info) }, k,
    mac ? { name: 'HMAC', hash: 'SHA-256', length: 256 } : { name: 'AES-GCM', length: 256 }, false,
    mac ? ['sign', 'verify'] : ['encrypt', 'decrypt']);
}
const sign = async (k, d) => new Uint8Array(await crypto.subtle.sign('HMAC', k, d));
const verify = (k, sig, d) => crypto.subtle.verify('HMAC', k, sig, d);
const ZERO = new Uint8Array(32);

class Chan {  // encrypted, ordered channel over one data connection. Nonce = direction + message counter, so replays/reorders fail to decrypt.
  constructor(conn, key, sd, rd, L) {
    Object.assign(this, { c: conn, key, sd, rd, L, sc: 0, rc: 0, q: Promise.resolve(), rq: Promise.resolve(), w: new Map(), rx: new Map(), x: 0, dead: false, drop: null });
  }
  iv(d, n) { const v = new Uint8Array(12); v[0] = d; new DataView(v.buffer).setUint32(8, n); return v; }
  send(type, pl) {
    const p = this.q.then(async () => {
      if (this.dead) throw new Error('closed');
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: this.iv(this.sd, this.sc++) }, this.key, cat(Uint8Array.of(type), pl));
      await this.drain();
      if (this.dead) throw new Error('closed');
      this.c.send(ct);
    });
    this.q = p.catch(() => {}); return p;
  }
  drain() {  // backpressure: wait while more than 1 MB is queued in the data channel
    const dc = this.c.dataChannel;
    if (!dc || dc.bufferedAmount <= 1 << 20) return;
    return new Promise(r => {
      const f = () => { clearInterval(t); dc.removeEventListener('bufferedamountlow', f); dc.removeEventListener('close', f); r(); };
      const t = setInterval(() => { if (this.dead || dc.bufferedAmount <= 1 << 20) f(); }, 500);
      dc.bufferedAmountLowThreshold = 1 << 18; dc.addEventListener('bufferedamountlow', f); dc.addEventListener('close', f);
    });
  }
  json(o) { return this.send(1, enc.encode(JSON.stringify(o))); }
  push(d) {
    this.rq = this.rq.then(async () => {
      if (this.dead) return;
      const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: this.iv(this.rd, this.rc++) }, this.key, d));
      this.L.seen = Date.now();
      await onMsg(this, pt[0], pt.subarray(1));
    }).catch(() => this.close());
  }
  close() { if (this.drop) this.drop(); try { this.c.close(); } catch (e) {} }
  kill() {  // connection is gone: fail everything in flight
    if (this.dead) return; this.dead = true;
    this.w.forEach(w => w('connection lost')); this.w.clear();
    this.rx.forEach(s => { s.sink.abort(); s.it.fail('Interrupted - connection lost'); }); this.rx.clear();
  }
}

/* ---------- links: one per remote device. status: unnamed | pending | ok | away | gone (host), connecting | verifying | pending | ok | away | failed | gone (guest) ---------- */
const S = { mode: '', me: devName(), peers: [], items: [], accept: true };
let H = null, G = null, dirHandle = null, wake = null;

function attach(L, conn, key, sd, rd) {
  const ch = new Chan(conn, key, sd, rd, L), old = L.ch;
  L.conn = conn; L.ch = ch; L.seen = Date.now();
  ch.drop = () => { if (ch.dead) return; ch.kill(); if (L.ch === ch) L.lost(L); };
  conn.on('close', ch.drop); conn.on('error', () => {});
  if (old) old.close();
  return ch;
}
function setLink(L, st) {
  L.status = st;
  if (st == 'ok' || st == 'gone') { const w = L.wait || []; L.wait = []; w.forEach(r => r(st == 'ok')); }
  render();
}
const whenOk = L => L.status == 'ok' ? Promise.resolve(true) : L.status == 'away' ? new Promise(r => (L.wait = L.wait || []).push(r)) : Promise.resolve(false);
const acceptWhy = L => L.status != 'ok' ? 'not connected' : S.accept ? null : 'receiving is turned off on that device';

function checkAlive(L) {  // after the page was in the background: make sure the link still works, otherwise drop it so it reconnects
  if (L.status != 'ok' || !L.ch) return;
  const ch = L.ch, pc = L.conn.peerConnection, dc = L.conn.dataChannel, st = pc && pc.iceConnectionState;
  if (st == 'failed' || st == 'closed' || (dc && dc.readyState != 'open')) return ch.close();
  const t0 = Date.now(); ch.json({ t: 'ping' }).catch(() => {});
  setTimeout(() => { if (L.ch === ch && !(L.seen > t0)) ch.close(); }, 15000);
}
function keepAwake() { if (navigator.wakeLock && !document.hidden) navigator.wakeLock.request('screen').then(l => wake = l).catch(() => {}); }
function wakeUp() {
  if (document.hidden || !S.mode) return;
  keepAwake();
  if (S.mode == 'host') hostSig();
  if (S.mode == 'guest' && G && !G.ended && G.L.status == 'away') { G.tries = 0; guestConnect(); }
  S.peers.forEach(checkAlive);
}
document.addEventListener('visibilitychange', wakeUp);
window.addEventListener('online', wakeUp);

/* ---------- file transfer (both directions) ---------- */
async function makeSink(name, mime) {
  if (dirHandle) {
    let nm = name, i = 0;
    for (;;) { try { await dirHandle.getFileHandle(nm); nm = name.replace(/(\.[^.]*)?$/, ` (${++i})$1`); } catch (e) { break; } }
    const w = await (await dirHandle.getFileHandle(nm, { create: true })).createWritable();
    return { write: b => w.write(b), close: async () => { await w.close(); return null; }, abort: () => w.abort().catch(() => {}) };
  }
  const parts = [];
  return { write: b => { parts.push(b.slice()); }, close: async () => new Blob(parts, { type: mime }), abort: () => { parts.length = 0; } };
}

function queueSend(L, file) {
  const it = addItem({ dir: 'out', name: file.name, size: file.size, mime: file.type, who: L.name, file, L });
  it.state(L.status == 'ok' ? 'Queued' : 'Waiting for connection...');
  L.sq = (L.sq || Promise.resolve()).then(() => sendFile(L, file, it));
}
async function sendFile(L, file, it) {
  if (!await whenOk(L)) return it.fail('Not connected');
  const ch = L.ch, x = ++ch.x;
  it.state('Waiting for ' + L.name + '...');
  const go = Promise.race([new Promise(res => ch.w.set(x, res)), sleep(30000).then(() => 'no answer')]);
  try {
    await ch.json({ t: 'offer', x, name: file.name, size: file.size, mime: file.type });
    const ans = await go; ch.w.delete(x); if (ans !== true) return it.fail('Not accepted: ' + ans);
    let off = 0, n = 0; const hd = new Uint8Array(4); new DataView(hd.buffer).setUint32(0, x);
    while (off < file.size) {
      const blk = new Uint8Array(await file.slice(off, off + CONFIG.chunk * 64).arrayBuffer());
      if (!blk.length) throw 0;
      for (let i = 0; i < blk.length; i += CONFIG.chunk) {
        if (ch.dead) throw 0;
        await ch.send(2, cat(hd, blk.subarray(i, i + CONFIG.chunk))); n++;
        it.set((off + Math.min(i + CONFIG.chunk, blk.length)) / file.size);
      }
      off += blk.length;
    }
    await ch.json({ t: 'end', x, n, size: file.size }); it.done();
  } catch (e) { it.fail(ch.dead ? 'Interrupted - connection lost' : 'Failed'); }
}

async function onMsg(ch, type, pl) {
  const L = ch.L;
  if (type == 2) {  // file chunk
    const s = ch.rx.get(new DataView(pl.buffer, pl.byteOffset).getUint32(0)); if (!s) throw 0;
    const b = pl.subarray(4); s.got += b.length; s.n++; if (s.got > s.size) throw 0;
    await s.sink.write(b); s.it.set(s.size ? s.got / s.size : 1); return;
  }
  const m = JSON.parse(dec.decode(pl));
  if (m.t == 'offer') {
    const nm = safeName(m.name), size = +m.size, why = acceptWhy(L);
    if (why || !(size >= 0) || size > (dirHandle ? 4e12 : CONFIG.memLimit)) return ch.json({ t: 'reject', x: m.x, why: why || 'too large to keep in memory' });
    const mime = typeof m.mime == 'string' && /^[\w.+-]+\/[\w.+-]+$/.test(m.mime) ? m.mime : '';
    const it = addItem({ dir: 'in', name: nm, size, mime, who: L.name });
    let sink; try { sink = await makeSink(nm, mime); } catch (e) { it.fail('Could not save'); return ch.json({ t: 'reject', x: m.x, why: 'could not save' }); }
    it.state('Receiving'); ch.rx.set(m.x, { size, got: 0, n: 0, it, sink });
    return ch.json({ t: 'go', x: m.x });
  }
  if (m.t == 'go' || m.t == 'reject') { const w = ch.w.get(m.x); ch.w.delete(m.x); if (w) w(m.t == 'go' ? true : String(m.why || 'refused')); return; }
  if (m.t == 'end') {
    const s = ch.rx.get(m.x); ch.rx.delete(m.x); if (!s) return;
    if (s.got !== m.size || s.n !== m.n || s.got !== s.size) { await s.sink.abort(); return s.it.fail('Incomplete'); }
    return s.it.done(await s.sink.close());
  }
  if (m.t == 'ping') return ch.json({ t: 'pong' });
  if (m.t == 'pong') return;
  return S.mode == 'host' ? hostApp(L, m) : guestApp(L, m);
}

/* ---------- GUEST ---------- */
function startGuest(hostId, secret, resume) {

  S.peers = [L];

}
function getGuestPeer(g) {
  const old = g.peer;

  if (old) try { old.destroy(); } catch (e) {}   // only reached when no live connection uses it
  return new Promise((res, rej) => {
